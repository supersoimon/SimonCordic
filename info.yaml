# Tiny Tapeout project information
project:
  title:        "SIMONCORDIC"      # Project title
  author:       "Simon Gidrewicz"      # Your name
  discord:      "youreverydaynerd"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A CORDIC accelerator for simple sine and cosine calculations"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

   tiles: "1x1"

  top_module: "tt_um_cordic"

  source_files:
    - "anglelookup.v"
    - "rotation.v"
    - "top.v"
    - "tt_um_cordic.v"
# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Angle data bit 0"
  ui[1]: "Angle data bit 1"
  ui[2]: "Angle data bit 2"
  ui[3]: "Angle data bit 3"
  ui[4]: "Angle data bit 4"
  ui[5]: "Angle data bit 5"
  ui[6]: "Angle data bit 6"
  ui[7]: "Angle data bit 7"

  # Outputs
  uo[0]: "Multiplexed result bit 0"
  uo[1]: "Multiplexed result bit 1"
  uo[2]: "Multiplexed result bit 2"
  uo[3]: "Multiplexed result bit 3"
  uo[4]: "Multiplexed result bit 4"
  uo[5]: "Multiplexed result bit 5"
  uo[6]: "Multiplexed result bit 6"
  uo[7]: "Multiplexed result bit 7"

  # Bidirectional pins (used as inputs in this design)
  uio[0]: "Angle byte index bit 0"
  uio[1]: "Angle byte index bit 1"
  uio[2]: "Angle write strobe"
  uio[3]: "CORDIC start"
  uio[4]: "Output select bit 0"
  uio[5]: "Output select bit 1"
  uio[6]: "Output select bit 2"
  uio[7]: ""

# Do not change!
yaml_version: 6
